# ruff.toml
line-length = 100

# Only crawl/lint the bricks folder. Keeps the language server fast and stops it
# from walking the 5GB data/ dir and the unparseable trees under other-bricks/.
include = ["bricks/**/*.py", "bricks/**/*.pyi"]
extend-exclude = [
    "data",
    "other-bricks",
    "notebooks",
    "agents",
]

[lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "PL"]
ignore = ["E501", "PLW1641", "B008"]

[lint.pylint]
max-args = 10